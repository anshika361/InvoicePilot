services:
  - type: web
    name: invoicepilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 30
    healthCheckPath: /healthz
    envVars:
      - key: INVOICEPILOT_HOSTED
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.8
